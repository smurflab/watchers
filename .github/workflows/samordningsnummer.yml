name: samordningsnummer

on:
  schedule:
    # Every 5 minutes (the smallest interval GitHub allows). Note: scheduled
    # runs can be delayed several minutes when GitHub is busy.
    - cron: "*/5 * * * *"
  # Lets you trigger a run by hand from the Actions tab to test it.
  workflow_dispatch:

# Don't pile up overlapping runs if one is slow.
concurrency:
  group: samordningsnummer
  cancel-in-progress: false

# All run steps execute inside this watcher's folder.
defaults:
  run:
    working-directory: samordningsnummer

jobs:
  check:
    runs-on: ubuntu-latest
    # ~50 min loop + setup. Well under GitHub's 6h per-job hard cap.
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip's wheel download cache, keyed on requirements.txt.
          # With playwright pinned, the wheel is reused instead of re-downloaded.
          cache: 'pip'
          cache-dependency-path: samordningsnummer/requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # GitHub's native cron is heavily throttled on this account (ran ~once every
      # 3-4h instead of every 5 min). Instead, each run loops internally for ~50
      # min checking every 5 min, then hands off to a fresh run before the 6h job
      # cap. This "self-loop" gives a reliable 5-min cadence 24/7.
      - name: Watch loop (~50 min, check every 5 min)
        env:
          # Per-watcher secret so each watcher pings its own ntfy topic.
          NTFY_TOPIC: ${{ secrets.NTFY_SAMORDNING }}
          # Separate quiet channel for health noise (inconclusive runs / errors).
          # Optional -- if unset, those are logged only, no push.
          NTFY_DEBUG_TOPIC: ${{ secrets.NTFY_SAMORDNING_DEBUG }}
        run: |
          end=$((SECONDS + 3000))          # ~50 minutes
          while [ $SECONDS -lt $end ]; do
            python check_slots.py || true  # never let one failed check kill the loop
            sleep 300                      # 5 minutes
          done

      # Start the next run before this job exits, so the chain self-perpetuates.
      # Needs a PAT (the default GITHUB_TOKEN cannot trigger new workflow runs).
      - name: Re-dispatch next run (self-loop handoff)
        if: always()                       # hand off even if the loop step errored
        env:
          GH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/smurflab/watchers/actions/workflows/samordningsnummer.yml/dispatches \
            -d '{"ref":"main"}'
